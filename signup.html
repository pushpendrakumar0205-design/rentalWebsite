<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      height: 100vh;
      background: linear-gradient(135deg, #36d1dc, #5b86e5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Box */
    .box {
      width: 100%;
      max-width: 380px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      color: white;
    }

    /* Inputs */
    .form-control {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
    }

    .form-control::placeholder {
      color: #ddd;
    }

    .form-control:focus {
      box-shadow: none;
      background: rgba(255, 255, 255, 0.3);
      color: white;
    }

    /* Button */
    .btn-signup {
      background: #fff;
      color: #333;
      font-weight: bold;
    }

    .btn-signup:hover {
      background: #ddd;
    }

    /* Link */
    a {
      color: #fff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>

</head>

<body>

  <div class="box shadow-lg">

    <h3 class="text-center mb-4">📝 Create Account</h3>

    <form action="signup.php" method="POST">

      <input type="text" name="name" placeholder="Enter Name" class="form-control mb-3" required>
      <input type="number" name="mobile" placeholder="Enter Phone Number" class="form-control mb-3" required>

      <input type="email" name="email" placeholder="Enter Email" class="form-control mb-3" required>

      <input type="password" name="password" placeholder="Enter Password" class="form-control mb-3" required>

      <input type="submit" name="signup" value="Signup" class="btn btn-signup w-100">

    </form>

    <p class="text-center mt-3">
      Already have account? <a href="login.html">Login</a>
    </p>

  </div>

</body>

</html>
